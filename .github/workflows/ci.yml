name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RBXDowngrader.sln

      - name: Build
        run: dotnet build RBXDowngrader.sln -c Release -m:1 --no-restore

      - name: Test
        run: dotnet test tests\RBXDowngrader.Core.Tests\RBXDowngrader.Core.Tests.csproj -c Release -m:1 --no-build --no-restore

  package-installer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: RBXDowngraderSetup-${{ github.ref_name }}
          path: artifacts\RBXDowngraderSetup-win-x64.exe
          if-no-files-found: error
